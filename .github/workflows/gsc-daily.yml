name: Search Console daily export

on:
  # The daily schedule is off until the Search Console secrets are added (see docs/gsc-setup.md).
  # To turn it on again, add under "on:":  schedule:  - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Export Search Console data
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: node scripts/gsc-export.mjs
      - name: Commit the data
        run: |
          git config user.name "gsc-bot"
          git config user.email "gsc-bot@users.noreply.github.com"
          git add docs/gsc
          git diff --cached --quiet || git commit -m "Search Console data [skip ci]"
          git push
